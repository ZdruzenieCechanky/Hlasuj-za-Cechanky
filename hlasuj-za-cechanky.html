
<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Hlasuj za Čechánky</title>
    <style>
        body {
            background: #f5f5f5;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        .info {
            font-size: 20px;
            color: #333;
        }

        #highlight-box {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            height: 330px;
            border: 5px solid #ff5722;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(255, 87, 34, 0.7);
            pointer-events: none;
            z-index: 9999;
            display: none;
        }
    </style>
</head>
<body>
    <div class="info">
        Prebieha presmerovanie na hlasovanie za projekt Čechánky…<br>
        Prosím počkajte 2 sekundy.
    </div>

    <div id="highlight-box"></div>

    <script>
        const targetURL = "https://spoludokazemevela.sk/nase-projekty/zelene-oazy/hlasovanie";

        window.location.href = targetURL;

        setTimeout(() => {
            try {
                window.scrollTo({
                    top: 1800,
                    behavior: "smooth"
                });

                setTimeout(() => {
                    const box = document.getElementById("highlight-box");
                    box.style.top = "260px";
                    box.style.display = "block";

                    setTimeout(() => {
                        box.style.display = "none";
                    }, 6000);

                }, 1200);

            } catch (e) {
                console.error("Highlight error:", e);
            }
        }, 2500);
    </script>
</body>
</html>
